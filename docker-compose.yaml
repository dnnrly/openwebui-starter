services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.6.31
    ports:
      - 8080:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - ENV=dev
      - WEBUI_AUTH=False
      - ENABLE_OPENAI_API=False
      - ENABLE_OLLAMA_API=True
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
      # ollama:
      #   condition: service_healthy
    # runtime: runc
  ollama:
    image: ollama/ollama:0.12.0
    ports:
      - 11434:11434
    volumes:
      - ./ollama:/root/.ollama
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:11434 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  test:
    image: ubuntu:22.04
    command: /usr/bin/nvidia-smi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
